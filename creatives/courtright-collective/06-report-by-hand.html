<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../fonts.css"><style>
.page { background: #F7F3EC; font-family: 'Outfit', sans-serif; color: #0E1520; display: flex; flex-direction: column; justify-content: space-between; padding: 110px 90px 90px; }
h1 { font-family: 'Cormorant Garamond', serif; font-size: 108px; font-weight: 400; line-height: 1.08; max-width: 950px; }
h1 em { font-style: italic; color: #C45C28; }
.steps { margin-top: 60px; display: flex; flex-direction: column; gap: 22px; max-width: 860px; }
.step { display: flex; gap: 26px; align-items: baseline; font-size: 34px; font-weight: 300; color: #5A5142; }
.step .n { font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 40px; color: #C45C28; width: 50px; flex-shrink: 0; }
.step.last { font-weight: 700; color: #0E1520; }
.bottom { display: flex; align-items: center; justify-content: space-between; }
.cta { background: #C45C28; color: #fff; font-weight: 700; font-size: 32px; padding: 28px 54px; border-radius: 8px; }
.brand { text-align: right; }
.wordmark { font-family: 'Cormorant Garamond', serif; font-size: 40px; font-weight: 600; }
.wordmark span { color: #C45C28; }
.url { font-size: 21px; color: #A39682; margin-top: 6px; letter-spacing: 0.04em; }
.page > div:first-child { flex: 1; display: flex; flex-direction: column; justify-content: center; }
</style></head><body><div class="page">
  <div>
    <h1>You built that report <em>by hand</em> again, didn't you?</h1>
    <div class="steps">
      <div class="step"><span class="n">i.</span><span>Export the spreadsheet. Again.</span></div>
      <div class="step"><span class="n">ii.</span><span>Copy, paste, fix the columns Excel mangled.</span></div>
      <div class="step"><span class="n">iii.</span><span>Email it to yourself "to check later."</span></div>
      <div class="step last"><span class="n">iv.</span><span>Or: it lands in your inbox every Monday, already done.</span></div>
    </div>
  </div>
  <div class="bottom">
    <div class="cta">Automate step iv →</div>
    <div class="brand"><div class="wordmark">Courtright <span>Collective</span></div><div class="url">courtrightco.com</div></div>
  </div>
</div></body></html>
