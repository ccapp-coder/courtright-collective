<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../fonts.css"><style>
.page { background: #FFFDF5; font-family: 'Outfit', sans-serif; color: #3A3226; display: flex; flex-direction: column; justify-content: space-between; padding: 100px 85px 90px; }
.vol { display: flex; align-items: center; gap: 30px; margin-bottom: 64px; max-width: 800px; }
.vol .icon { font-size: 54px; }
.vol .track { flex: 1; height: 16px; background: rgba(58,50,38,0.1); border-radius: 999px; position: relative; }
.vol .knob { position: absolute; left: 6%; top: 50%; transform: translate(-50%,-50%); width: 48px; height: 48px; border-radius: 50%; background: #F0B800; border: 5px solid #3A3226; }
h1 { font-size: 96px; font-weight: 700; line-height: 1.06; letter-spacing: -0.02em; max-width: 960px; }
h1 em { font-style: italic; font-family: 'Lora', serif; font-weight: 700; color: #C79600; }
.sub { font-size: 40px; line-height: 1.55; color: #6E6353; margin-top: 54px; max-width: 900px; }
.sub b { color: #3A3226; }
.bottom { display: flex; align-items: center; justify-content: space-between; }
.cta { background: #F0B800; color: #3A3226; font-weight: 700; font-size: 34px; padding: 28px 54px; border-radius: 999px; }
.brand { text-align: right; }
.wordmark { font-size: 38px; font-weight: 700; }
.url { font-size: 22px; color: #A89A83; margin-top: 4px; }
.page > div:first-child { flex: 1; display: flex; flex-direction: column; justify-content: center; }
</style></head><body><div class="page">
  <div>
    <div class="vol"><span class="icon">🔈</span><div class="track"><div class="knob"></div></div></div>
    <h1>An app your toddler loves that you <em>can't hear</em> from the kitchen.</h1>
    <div class="sub">No theme songs. No sound effects that live in your head rent-free. Just soft, satisfying taps... <b>quiet enough that you'll check if they're still playing.</b> (They are.)</div>
  </div>
  <div class="bottom">
    <div class="cta">Hear the silence</div>
    <div class="brand"><div class="wordmark">TinkerTaps</div><div class="url">tinkertaps.courtrightco.com</div></div>
  </div>
</div></body></html>
