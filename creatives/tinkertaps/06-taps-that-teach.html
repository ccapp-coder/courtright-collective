<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../fonts.css"><style>
.page { background: #FFFDF5; font-family: 'Outfit', sans-serif; color: #3A3226; display: flex; flex-direction: column; justify-content: space-between; padding: 95px 85px 90px; }
.kicker { font-size: 24px; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; color: #C79600; margin-bottom: 28px; }
h1 { font-size: 94px; font-weight: 700; line-height: 1.06; letter-spacing: -0.02em; max-width: 940px; }
h1 em { font-style: italic; font-family: 'Lora', serif; font-weight: 700; color: #C79600; }
.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; margin-top: 60px; max-width: 920px; }
.cell { aspect-ratio: 1; border-radius: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; font-size: 26px; font-weight: 700; }
.cell .shape { width: 84px; height: 84px; }
.c1 { background: #FDF0C2; } .c2 { background: #F6E3D3; } .c3 { background: #E4EAD9; } .c4 { background: #EFE8D8; }
.sub { font-size: 38px; line-height: 1.5; color: #6E6353; margin-top: 54px; max-width: 900px; }
.sub b { color: #3A3226; }
.bottom { display: flex; align-items: center; justify-content: space-between; }
.cta { background: #F0B800; color: #3A3226; font-weight: 700; font-size: 34px; padding: 28px 54px; border-radius: 999px; }
.brand { text-align: right; }
.wordmark { font-size: 38px; font-weight: 700; }
.url { font-size: 22px; color: #A89A83; margin-top: 4px; }
.page > div:first-child { flex: 1; display: flex; flex-direction: column; justify-content: center; }
</style></head><body><div class="page">
  <div>
    <div class="kicker">Quietly educational</div>
    <h1>Every tap is <em>building something.</em></h1>
    <div class="grid">
      <div class="cell c1"><svg class="shape" viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="#F0B800"/></svg>Shapes</div>
      <div class="cell c2"><svg class="shape" viewBox="0 0 100 100"><rect x="12" y="12" width="76" height="76" rx="14" fill="#E8A87C"/></svg>Colors</div>
      <div class="cell c3"><svg class="shape" viewBox="0 0 100 100"><polygon points="50,10 90,85 10,85" fill="#9CAF88"/></svg>Cause &amp; effect</div>
      <div class="cell c4"><svg class="shape" viewBox="0 0 100 100"><circle cx="34" cy="50" r="22" fill="#C79600"/><circle cx="70" cy="50" r="14" fill="#3A3226"/></svg>Fine motor</div>
    </div>
    <div class="sub">Sensory play dressed up as a quiet game. <b>They think they're tapping bubbles. They're wiring a brain.</b></div>
  </div>
  <div class="bottom">
    <div class="cta">See the activities</div>
    <div class="brand"><div class="wordmark">TinkerTaps</div><div class="url">tinkertaps.courtrightco.com</div></div>
  </div>
</div></body></html>
