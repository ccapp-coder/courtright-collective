<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../fonts.css"><style>
.page { background: #F0B800; font-family: 'Outfit', sans-serif; color: #3A3226; display: flex; flex-direction: column; justify-content: space-between; padding: 100px 85px 90px; }
.big { font-size: 190px; font-weight: 700; line-height: 0.95; letter-spacing: -0.04em; }
h1 { font-size: 76px; font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; max-width: 940px; margin-top: 40px; }
.list { margin-top: 56px; display: flex; flex-direction: column; gap: 20px; font-size: 40px; color: rgba(58,50,38,0.85); }
.list .row { display: flex; gap: 22px; align-items: baseline; }
.list .row::before { content: '✕'; font-weight: 700; }
.bottom { display: flex; align-items: center; justify-content: space-between; }
.cta { background: #3A3226; color: #FFFDF5; font-weight: 700; font-size: 34px; padding: 28px 54px; border-radius: 999px; }
.brand { text-align: right; }
.wordmark { font-size: 38px; font-weight: 700; }
.url { font-size: 22px; color: rgba(58,50,38,0.6); margin-top: 4px; }
.page > div:first-child { flex: 1; display: flex; flex-direction: column; justify-content: center; }
</style></head><body><div class="page">
  <div>
    <div class="big">Zero.</div>
    <h1>Ads your toddler will see in TinkerTaps. Ever.</h1>
    <div class="list">
      <div class="row">No ad breaks aimed at a two-year-old</div>
      <div class="row">No "premium coins" mid-tantrum</div>
      <div class="row">No mystery buttons that call your boss</div>
    </div>
  </div>
  <div class="bottom">
    <div class="cta">Play without landmines</div>
    <div class="brand"><div class="wordmark">TinkerTaps</div><div class="url">tinkertaps.courtrightco.com</div></div>
  </div>
</div></body></html>
