<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../fonts.css"><style>
.page { background: #3A3226; font-family: 'Outfit', sans-serif; color: #FFFDF5; display: flex; flex-direction: column; justify-content: space-between; padding: 100px 85px 90px; }
h1 { font-size: 94px; font-weight: 700; line-height: 1.06; letter-spacing: -0.02em; max-width: 940px; }
h1 em { font-style: italic; font-family: 'Lora', serif; font-weight: 700; color: #F0B800; }
.list { margin-top: 60px; display: flex; flex-direction: column; gap: 26px; max-width: 860px; }
.row { display: flex; align-items: center; gap: 26px; font-size: 40px; color: rgba(255,253,245,0.85); }
.row .mark { width: 58px; height: 58px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 700; flex-shrink: 0; }
.no .mark { background: rgba(255,253,245,0.12); color: rgba(255,253,245,0.6); }
.no span.txt { text-decoration: line-through; opacity: 0.6; }
.yes .mark { background: #F0B800; color: #3A3226; }
.yes { font-weight: 700; color: #FFFDF5; }
.bottom { display: flex; align-items: center; justify-content: space-between; }
.cta { background: #F0B800; color: #3A3226; font-weight: 700; font-size: 34px; padding: 28px 54px; border-radius: 999px; }
.brand { text-align: right; }
.wordmark { font-size: 38px; font-weight: 700; }
.url { font-size: 22px; color: rgba(255,253,245,0.5); margin-top: 4px; }
.page > div:first-child { flex: 1; display: flex; flex-direction: column; justify-content: center; }
</style></head><body><div class="page">
  <div>
    <h1>Kids' apps don't have to be <em>this loud.</em></h1>
    <div class="list">
      <div class="row no"><span class="mark">✕</span><span class="txt">Flashing candy-colored chaos</span></div>
      <div class="row no"><span class="mark">✕</span><span class="txt">A mascot shouting "GREAT JOB!!" on loop</span></div>
      <div class="row no"><span class="mark">✕</span><span class="txt">The meltdown when it's time to stop</span></div>
      <div class="row yes"><span class="mark">✓</span><span>Soft sounds, gentle taps, calm little wins</span></div>
      <div class="row yes"><span class="mark">✓</span><span>A toddler who hands the phone back okay</span></div>
    </div>
  </div>
  <div class="bottom">
    <div class="cta">Try the calm one</div>
    <div class="brand"><div class="wordmark">TinkerTaps</div><div class="url">tinkertaps.courtrightco.com</div></div>
  </div>
</div></body></html>
