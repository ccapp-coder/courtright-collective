<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../fonts.css"><style>
.page { background: #FFF0F7; font-family: 'Bricolage', sans-serif; color: #12060D; display: flex; flex-direction: column; justify-content: space-between; padding: 100px 90px 90px; }
.kicker { font-size: 26px; font-weight: 700; letter-spacing: 0.28em; text-transform: uppercase; color: #FF2D92; margin-bottom: 40px; }
.pitch { font-size: 58px; font-weight: 700; line-height: 1.22; letter-spacing: -0.02em; max-width: 900px; }
.pitch .soft { font-weight: 400; color: #6E4457; }
.pitch em { font-style: normal; color: #FF2D92; }
.close { font-size: 44px; font-weight: 700; margin-top: 60px; }
.bottom { display: flex; align-items: center; justify-content: space-between; }
.cta { background: #12060D; color: #fff; font-weight: 700; font-size: 34px; padding: 28px 54px; border-radius: 999px; }
.brand { text-align: right; }
.wordmark { font-size: 40px; font-weight: 700; }
.url { font-size: 22px; color: #B37A94; margin-top: 4px; }
.page > div:first-child { flex: 1; display: flex; flex-direction: column; justify-content: center; }
</style></head><body><div class="page">
  <div>
    <div class="kicker">The honest pitch</div>
    <div class="pitch">
      <span class="soft">We're not going to tell you Trivd will change your life.</span><br><br>
      It's a trivia app. <span class="soft">But here's the thing...</span> it's a <em>really, really good</em> trivia app.
    </div>
    <div class="close">Play. Learn some stuff. Feel smart.<br>That's the whole pitch. 🤷</div>
  </div>
  <div class="bottom">
    <div class="cta">Fair enough, I'm in</div>
    <div class="brand"><div class="wordmark">Trivd</div><div class="url">trivd.courtrightco.com</div></div>
  </div>
</div></body></html>
