<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../fonts.css"><style>
.page { background: #FF2D92; font-family: 'Bricolage', sans-serif; color: #fff; display: flex; flex-direction: column; justify-content: space-between; padding: 90px 80px; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.line { font-size: 128px; font-weight: 700; line-height: 1.04; letter-spacing: -0.03em; }
.line .num { color: #12060D; }
.sub { font-size: 44px; font-weight: 400; line-height: 1.4; max-width: 900px; color: rgba(255,255,255,0.92); margin-top: 64px; }
.sub b { font-weight: 700; color: #12060D; }
.bottom { display: flex; align-items: center; justify-content: space-between; }
.cta { background: #12060D; color: #fff; font-weight: 700; font-size: 34px; padding: 28px 54px; border-radius: 999px; }
.brand { text-align: right; }
.wordmark { font-size: 40px; font-weight: 700; }
.url { font-size: 22px; color: rgba(255,255,255,0.75); margin-top: 4px; }
.page > div:first-child { flex: 1; display: flex; flex-direction: column; justify-content: center; }
</style></head><body><div class="page">
  <div>
    <div class="stack">
      <div class="line"><span class="num">5</span> questions.</div>
      <div class="line"><span class="num">1</span> topic a day.</div>
      <div class="line"><span class="num">3</span> minutes.</div>
      <div class="line"><span class="num">0</span> mercy.</div>
    </div>
    <div class="sub">Today's topic changes tomorrow. Your friends are already playing. 🧠 <b>You'll know who the smart one is by bedtime.</b></div>
  </div>
  <div class="bottom">
    <div class="cta">Play today's challenge</div>
    <div class="brand"><div class="wordmark">Trivd</div><div class="url">trivd.courtrightco.com</div></div>
  </div>
</div></body></html>
