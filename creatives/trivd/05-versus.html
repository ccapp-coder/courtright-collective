<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../fonts.css"><style>
.page { background: #12060D; font-family: 'Bricolage', sans-serif; color: #fff; display: flex; flex-direction: column; }
.split { flex: 1; display: flex; position: relative; }
.side { flex: 1; display: flex; flex-direction: column; justify-content: center; }
.side.left { background: #FF2D92; padding: 60px 130px 60px 70px; }
.side.right { background: #1E0A15; padding: 60px 70px 60px 130px; }
.side .label { font-size: 22px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.7; margin-bottom: 24px; }
.side h2 { font-size: 54px; font-weight: 700; line-height: 1.12; letter-spacing: -0.015em; }
.vs { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 170px; height: 170px; border-radius: 50%; background: #fff; color: #12060D; display: flex; align-items: center; justify-content: center; font-size: 64px; font-weight: 700; border: 10px solid #12060D; }
.bottom { padding: 56px 80px; display: flex; align-items: center; justify-content: space-between; background: #12060D; }
.tag { font-size: 34px; font-weight: 400; color: #C99BB1; max-width: 500px; line-height: 1.3; }
.tag b { color: #fff; }
.ctaWrap { display: flex; flex-direction: column; align-items: flex-end; gap: 14px; }
.cta { background: #FF2D92; color: #fff; font-weight: 700; font-size: 32px; padding: 26px 50px; border-radius: 999px; }
.url { font-size: 22px; color: #8A5B72; }
</style></head><body><div class="page">
  <div class="split">
    <div class="side left">
      <div class="label">You</div>
      <h2>"I'm honestly pretty good at trivia."</h2>
    </div>
    <div class="side right">
      <div class="label">Also you, question 4</div>
      <h2>"Wait... they changed the capital of WHERE?"</h2>
    </div>
    <div class="vs">VS</div>
  </div>
  <div class="bottom">
    <div class="tag"><b>Head-to-head. Real time.</b> Humbling for everybody. 🙌</div>
    <div class="ctaWrap"><div class="cta">Challenge a friend</div><div class="url">Trivd · trivd.courtrightco.com</div></div>
  </div>
</div></body></html>
