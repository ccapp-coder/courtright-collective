<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../fonts.css"><style>
.page { background: #12060D; font-family: 'Bricolage', sans-serif; color: #fff; display: flex; flex-direction: column; justify-content: space-between; padding: 100px 80px 90px; }
h1 { font-size: 128px; font-weight: 700; line-height: 1.03; letter-spacing: -0.03em; }
h1 em { font-style: normal; color: #FF2D92; }
.dare { margin-top: 60px; display: inline-flex; align-items: center; gap: 24px; }
.dare-box { border: 3px solid #FF2D92; border-radius: 24px; padding: 34px 44px; font-size: 44px; font-weight: 700; color: #FF2D92; }
.sub { font-size: 36px; line-height: 1.45; color: #C99BB1; max-width: 780px; margin-top: 56px; }
.bottom { display: flex; align-items: center; justify-content: space-between; }
.cta { background: #FF2D92; color: #fff; font-weight: 700; font-size: 34px; padding: 28px 54px; border-radius: 999px; }
.brand { text-align: right; }
.wordmark { font-size: 40px; font-weight: 700; }
.url { font-size: 22px; color: #8A5B72; margin-top: 4px; }
.page > div:first-child { flex: 1; display: flex; flex-direction: column; justify-content: center; }
</style></head><body><div class="page">
  <div>
    <h1>You think you're the <em>smart friend.</em></h1>
    <div class="dare"><div class="dare-box">Prove it. 🎯</div></div>
    <div class="sub">Five questions, head to head, real time. Either you were right about yourself... or you're about to learn something. Both are fun for us.</div>
  </div>
  <div class="bottom">
    <div class="cta">Free to play</div>
    <div class="brand"><div class="wordmark">Trivd</div><div class="url">trivd.courtrightco.com</div></div>
  </div>
</div></body></html>
