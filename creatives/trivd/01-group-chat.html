<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../fonts.css"><style>
.page { background: #12060D; font-family: 'Bricolage', sans-serif; color: #fff; display: flex; flex-direction: column; }
.top { padding: 70px 80px 0; }
.kicker { font-size: 26px; font-weight: 700; letter-spacing: 0.28em; text-transform: uppercase; color: #FF2D92; margin-bottom: 28px; }
h1 { font-size: 84px; font-weight: 700; line-height: 1.04; letter-spacing: -0.02em; }
.chat { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 22px; padding: 20px 80px; }
.bubble { max-width: 640px; padding: 26px 34px; border-radius: 34px; font-size: 34px; line-height: 1.3; font-weight: 400; }
.them { background: #2A1520; color: #F4D9E6; border-bottom-left-radius: 10px; align-self: flex-start; }
.me { background: #FF2D92; color: #fff; border-bottom-right-radius: 10px; align-self: flex-end; }
.name { font-size: 20px; color: #8A5B72; margin: 0 0 -12px 36px; letter-spacing: 0.06em; }
.bottom { padding: 0 80px 70px; display: flex; align-items: center; justify-content: space-between; }
.cta { background: #FF2D92; color: #fff; font-weight: 700; font-size: 34px; padding: 28px 54px; border-radius: 999px; }
.brand { text-align: right; }
.wordmark { font-size: 40px; font-weight: 700; letter-spacing: -0.01em; }
.url { font-size: 22px; color: #8A5B72; margin-top: 4px; }
</style></head><body><div class="page">
  <div class="top">
    <div class="kicker">Group chat, 9:47 PM</div>
    <h1>Every group chat has this argument.</h1>
  </div>
  <div class="chat">
    <div class="name">Tyler</div>
    <div class="bubble them">there's no way you knew that without googling it</div>
    <div class="bubble me">I literally studied astronomy in college??</div>
    <div class="name">Tyler</div>
    <div class="bubble them">you took one elective. ONE.</div>
    <div class="bubble me">fine. five questions. right now. loser buys wings 🍗</div>
  </div>
  <div class="bottom">
    <div class="cta">Settle it in Trivd →</div>
    <div class="brand"><div class="wordmark">Trivd</div><div class="url">trivd.courtrightco.com</div></div>
  </div>
</div></body></html>
