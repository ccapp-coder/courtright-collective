<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../fonts.css"><style>
.page { background: #1B2A4A; font-family: 'Work Sans', sans-serif; color: #fff; display: flex; flex-direction: column; justify-content: space-between; padding: 100px 85px 90px; }
.kicker { font-size: 24px; font-weight: 700; letter-spacing: 0.24em; text-transform: uppercase; color: #4ADE80; margin-bottom: 34px; }
h1 { font-size: 96px; font-weight: 700; line-height: 1.06; letter-spacing: -0.025em; max-width: 950px; }
.blank { display: inline-block; width: 320px; border-bottom: 6px solid #4ADE80; }
.sub { font-size: 42px; line-height: 1.5; color: #A9B7D0; margin-top: 60px; max-width: 900px; }
.sub b { color: #fff; }
.sub .beat { color: #4ADE80; font-weight: 700; }
.bottom { display: flex; align-items: center; justify-content: space-between; }
.cta { background: #16A34A; color: #fff; font-weight: 700; font-size: 34px; padding: 28px 54px; border-radius: 10px; }
.brand { text-align: right; }
.wordmark { font-size: 38px; font-weight: 700; }
.wordmark span { color: #4ADE80; }
.url { font-size: 22px; color: #5E7099; margin-top: 4px; }
.page > div:first-child { flex: 1; display: flex; flex-direction: column; justify-content: center; }
</style></head><body><div class="page">
  <div>
    <div class="kicker">Quick question, seller to seller</div>
    <h1>Promoted Listings cost you $<span class="blank"></span> last month.</h1>
    <div class="sub">Couldn't fill in the blank? <span class="beat">That's the problem.</span> eBay knows the number to the penny. You should too. <b>RateTamer pulls it apart per SKU</b> and shows you which part was worth it.</div>
  </div>
  <div class="bottom">
    <div class="cta">Fill in the blank, free</div>
    <div class="brand"><div class="wordmark">Rate<span>Tamer</span></div><div class="url">ratetamer.com</div></div>
  </div>
</div></body></html>
