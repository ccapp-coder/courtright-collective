<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../fonts.css"><style>
.page { background: #16A34A; font-family: 'Work Sans', sans-serif; color: #fff; display: flex; flex-direction: column; justify-content: space-between; padding: 100px 85px 90px; }
.rates { display: flex; gap: 26px; align-items: baseline; font-family: 'IBM Plex Mono', monospace; font-weight: 700; margin-bottom: 56px; }
.r { color: rgba(255,255,255,0.55); }
.r1 { font-size: 96px; transform: rotate(-6deg); }
.r2 { font-size: 140px; transform: rotate(4deg); color: #1B2A4A; }
.r3 { font-size: 80px; transform: rotate(-3deg); }
.r4 { font-size: 116px; transform: rotate(7deg); }
h1 { font-size: 104px; font-weight: 700; line-height: 1.03; letter-spacing: -0.03em; max-width: 950px; }
h1 em { font-style: normal; color: #1B2A4A; }
.sub { font-size: 40px; line-height: 1.5; color: rgba(255,255,255,0.92); margin-top: 52px; max-width: 900px; }
.sub b { color: #1B2A4A; }
.bottom { display: flex; align-items: center; justify-content: space-between; }
.cta { background: #1B2A4A; color: #fff; font-weight: 700; font-size: 34px; padding: 28px 54px; border-radius: 10px; }
.brand { text-align: right; }
.wordmark { font-size: 38px; font-weight: 700; }
.wordmark span { color: #1B2A4A; }
.url { font-size: 22px; color: rgba(255,255,255,0.75); margin-top: 4px; }
.page > div:first-child { flex: 1; display: flex; flex-direction: column; justify-content: center; }
</style></head><body><div class="page">
  <div>
    <div class="rates"><span class="r r1">7%</span><span class="r r2">13%</span><span class="r r3">5%</span><span class="r r4">11%</span></div>
    <h1>Your ad rates are running <em>feral.</em></h1>
    <div class="sub">Set once, forgotten, drifting up with every "suggested rate" nudge. It's in the name, folks. <b>RateTamer brings them to heel</b>... every SKU at the rate the data says, not the rate the platform hopes.</div>
  </div>
  <div class="bottom">
    <div class="cta">Tame them →</div>
    <div class="brand"><div class="wordmark">Rate<span>Tamer</span></div><div class="url">ratetamer.com</div></div>
  </div>
</div></body></html>
