<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../fonts.css"><style>
.page { background: #16A34A; font-family: 'Work Sans', sans-serif; color: #fff; display: flex; flex-direction: column; justify-content: space-between; padding: 100px 85px 90px; }
h1 { font-size: 130px; font-weight: 700; line-height: 1.0; letter-spacing: -0.03em; }
h1 .dark { color: #1B2A4A; }
.checks { margin-top: 64px; display: flex; flex-direction: column; gap: 26px; font-size: 44px; font-weight: 700; }
.checks .row { display: flex; align-items: center; gap: 24px; }
.checks .mark { width: 64px; height: 64px; border-radius: 50%; background: #1B2A4A; display: flex; align-items: center; justify-content: center; font-size: 34px; flex-shrink: 0; }
.sub { font-size: 38px; line-height: 1.45; color: rgba(255,255,255,0.9); margin-top: 56px; max-width: 880px; font-weight: 400; }
.bottom { display: flex; align-items: center; justify-content: space-between; }
.cta { background: #1B2A4A; color: #fff; font-weight: 700; font-size: 34px; padding: 28px 54px; border-radius: 10px; }
.brand { text-align: right; }
.wordmark { font-size: 38px; font-weight: 700; }
.wordmark span { color: #1B2A4A; }
.url { font-size: 22px; color: rgba(255,255,255,0.75); margin-top: 4px; }
.page > div:first-child { flex: 1; display: flex; flex-direction: column; justify-content: center; }
</style></head><body><div class="page">
  <div>
    <h1>Free audit. <span class="dark">Full stop.</span></h1>
    <div class="checks">
      <div class="row"><span class="mark">✓</span> No signup</div>
      <div class="row"><span class="mark">✓</span> No credit card</div>
      <div class="row"><span class="mark">✓</span> No sales call ambush</div>
    </div>
    <div class="sub">Point it at your Promoted Listings, and see per SKU where the fees are leaking. If it saves you money, great. If not, you spent two minutes. That's the entire risk.</div>
  </div>
  <div class="bottom">
    <div class="cta">Start the audit →</div>
    <div class="brand"><div class="wordmark">Rate<span>Tamer</span></div><div class="url">ratetamer.com</div></div>
  </div>
</div></body></html>
