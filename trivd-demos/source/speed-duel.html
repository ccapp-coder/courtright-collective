<!DOCTYPE html>
<html><head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="style.css"/>
<style>
  .vs-wrap { display:flex; align-items:center; gap:40px; }
  .vs-card { width:230px; padding:36px 20px; background:var(--card); border-radius:26px;
    border:2px solid rgba(255,255,255,0.1); text-align:center;
    animation:rise 0.5s both cubic-bezier(0.2,1.3,0.4,1); }
  .vs-card .av { width:110px; height:110px; border-radius:50%; margin:0 auto 18px;
    display:flex; align-items:center; justify-content:center; font-size:52px; font-weight:900; }
  .vs-card .nm { font-size:34px; font-weight:800; }
  .vs-flash { font-size:100px; font-weight:900; color:var(--pink);
    text-shadow:0 0 50px rgba(255,45,146,0.7); animation:drop 0.5s 0.3s both; }
</style>
</head><body>
<script src="engine.js"></script>
<script>
(async () => {
  buildStage({
    accent: "var(--yellow)",
    chip: "⚡ SPEED DUEL · FIRST CORRECT ANSWER WINS",
    players: [
      { id: "me",  cls: "me",  av: "Y", name: "You",  pips: 3 },
      { id: "foe", cls: "foe", av: "M", name: "Maya", pips: 3 },
    ],
  });

  await titleCard({
    icon: "⚡", title: "Speed<br/>Duel",
    sub: "1v1 · First correct answer wins",
    flair: "Fastest fingers take the round.",
  }, 3100);

  /* matchup card */
  const m = overlay(`
    <div class="vs-wrap">
      <div class="vs-card"><div class="av" style="background:var(--yellow);color:#000">Y</div><div class="nm">You</div></div>
      <div class="vs-flash">VS</div>
      <div class="vs-card" style="animation-delay:0.15s"><div class="av" style="background:var(--purple)">M</div><div class="nm">Maya</div></div>
    </div>
    <div class="mode-sub" style="margin-top:44px">First to 2 rounds wins the duel</div>`);
  await sleep(2400); await dismiss(m);

  $("#app").classList.add("on");
  const mePips = document.querySelectorAll("#pl-me .pip");
  const foePips = document.querySelectorAll("#pl-foe .pip");

  /* ── Round 1: you win the race ── */
  setQnum("1/3");
  let pills = showQuestion("What is the capital of Australia?",
    ["Sydney", "Canberra", "Melbourne", "Perth"], 10);
  await sleep(2100);
  $("#pl-foe").classList.add("answering");           // Maya is racing you
  await sleep(1000);
  await tap(pills, 1, { who: "YOU" });
  stopTimer();
  $("#pl-foe").classList.remove("answering");
  setScore(100); setPScore("me", 100); mePips[0].classList.add("won");
  await toast("+100 · FIRST! ⚡", "b-gold");
  await hideQuestion();

  /* ── Round 2: Maya takes it ── */
  setQnum("2/3");
  pills = showQuestion("Which band released the album “Abbey Road”?",
    ["The Rolling Stones", "Pink Floyd", "The Beatles", "Queen"], 10);
  await sleep(1600);
  $("#pl-foe").classList.add("answering");
  await sleep(900);
  await tap(pills, 2, { who: "MAYA" });
  stopTimer();
  $("#pl-foe").classList.remove("answering");
  setPScore("foe", 100); foePips[0].classList.add("won");
  await toast("Maya took it! 🔥", "b-purple");
  await hideQuestion();

  /* ── Round 3: buzzer-beater ── */
  setQnum("3/3");
  pills = showQuestion("How many strings does a standard violin have?",
    ["Four", "Five", "Six", "Seven"], 5);
  await sleep(3400);                                  // timer runs low, tension
  await tap(pills, 0, { who: "YOU" });
  stopTimer();
  setScore(200); setPScore("me", 200); mePips[1].classList.add("won");
  await toast("+100 · BUZZER BEATER! ⚡", "b-gold");
  await sleep(200);

  /* victory */
  confetti(70, ["#FFE500", "#FFF176", "#FF2D92", "#7C3AED"]);
  const v = overlay(`
    <div class="big-icon">🏆</div>
    <div class="mode-title" style="color:var(--yellow)">Victory</div>
    <div class="mode-sub">You beat Maya · 2–1</div>
    <div class="mode-flair">Knowledge helps. Reflexes win.</div>`, { clear: true });
  await sleep(2800); await dismiss(v);

  await endCard();
  finish();
})();
</script>
</body></html>
