<!-- ============================================================
     SIGNATURE 04: THE BOOKING CTA
     For anyone whose business runs on booked calls. The button
     is a bulletproof table cell, not an image, so it renders in
     Outlook and survives image blocking.
     ============================================================ -->
<table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;font-family:Helvetica,Arial,sans-serif;">
  <tr>
    <td valign="top" style="border-left:4px solid #C45C28;padding:2px 0 2px 14px;">
      <span style="font-family:Georgia,'Times New Roman',serif;font-size:19px;font-weight:bold;color:#0E1520;">[FIRST NAME] [LAST NAME]</span><br>
      <span style="font-size:13px;color:#7A7268;">[JOB TITLE], [COMPANY NAME]</span><br>
      <span style="font-size:13px;line-height:20px;">
        <a href="tel:[PHONE-DIGITS-ONLY]" style="color:#0E1520;text-decoration:none;">[PHONE]</a>
        <span style="color:#C4C0B8;">&nbsp;|&nbsp;</span>
        <a href="https://[WEBSITE]" style="color:#C45C28;text-decoration:none;font-weight:bold;">[WEBSITE]</a>
      </span>
      <table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;margin-top:12px;">
        <tr>
          <td align="center" bgcolor="#C45C28" style="background-color:#C45C28;border-radius:5px;">
            <a href="https://[BOOKING-LINK]"
               style="display:inline-block;padding:9px 20px;font-family:Helvetica,Arial,sans-serif;
                      font-size:13px;font-weight:bold;color:#FFFFFF;text-decoration:none;
                      letter-spacing:0.3px;border-radius:5px;">
              [BUTTON TEXT, e.g. Book a free 15-min call]
            </a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
