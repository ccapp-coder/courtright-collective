<!-- ============================================================
     SIGNATURE 05: THE SOCIAL
     Text-based social links instead of icon images. Icons are
     the number one reason signatures look broken, because half
     of email blocks remote images by default. Words never break.
     Delete any platform you do not use.
     ============================================================ -->
<table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;font-family:Helvetica,Arial,sans-serif;">
  <tr>
    <td style="padding:0 0 8px 0;">

      <span style="font-size:13px;color:#C45C28;font-weight:bold;">[JOB TITLE]</span>
      <span style="font-size:13px;color:#7A7268;">&nbsp;&bull;&nbsp;[COMPANY NAME]</span>
    </td>
  </tr>
  <tr>
    <td style="font-size:13px;line-height:20px;color:#0E1520;padding:0 0 10px 0;">
      <a href="mailto:[EMAIL]" style="color:#0E1520;text-decoration:none;">[EMAIL]</a>
      <span style="color:#C4C0B8;">&nbsp;|&nbsp;</span>
      <a href="tel:[PHONE-DIGITS-ONLY]" style="color:#0E1520;text-decoration:none;">[PHONE]</a>
      <span style="color:#C4C0B8;">&nbsp;|&nbsp;</span>
      <a href="https://[WEBSITE]" style="color:#C45C28;text-decoration:none;font-weight:bold;">[WEBSITE]</a>
    </td>
  </tr>
