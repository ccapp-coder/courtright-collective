<!-- ============================================================
     SIGNATURE 07: THE TWO COLUMN
     For people with a lot to say: two locations, two brands, a
     license number, an address, hours. Divider keeps it from
     turning into a wall.
     ============================================================ -->
<table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;font-family:Helvetica,Arial,sans-serif;">
  <tr>
    <td valign="top" style="padding:0 20px 0 0;">
      <span style="font-family:Georgia,'Times New Roman',serif;font-size:19px;font-weight:bold;color:#0E1520;">[FIRST NAME] [LAST NAME]</span><br>
      <span style="font-size:13px;color:#C45C28;font-weight:bold;">[JOB TITLE]</span><br>
      <span style="font-size:13px;color:#7A7268;line-height:19px;">[COMPANY NAME]</span><br>
      <table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;margin-top:8px;">
        <tr><td height="3" width="60" style="background-color:#D9A030;font-size:0;line-height:0;">&nbsp;</td></tr>
      </table>
    </td>
    <td valign="top" style="border-left:1px solid #E0DAD0;padding:0 0 0 20px;font-size:12px;line-height:19px;color:#0E1520;">
      <a href="tel:[PHONE-DIGITS-ONLY]" style="color:#0E1520;text-decoration:none;">[PHONE]</a><br>
      <a href="mailto:[EMAIL]" style="color:#0E1520;text-decoration:none;">[EMAIL]</a><br>
      <a href="https://[WEBSITE]" style="color:#C45C28;text-decoration:none;font-weight:bold;">[WEBSITE]</a><br>
      <span style="color:#7A7268;">[STREET ADDRESS]</span><br>
      <span style="color:#7A7268;">[CITY, STATE ZIP]</span><br>
      <span style="color:#7A7268;">[LICENSE # OR HOURS, optional]</span>
    </td>
  </tr>
</table>
