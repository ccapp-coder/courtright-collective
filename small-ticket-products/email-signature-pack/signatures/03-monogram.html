<!-- ============================================================
     SIGNATURE 03: THE MONOGRAM
     A colored initials block instead of a logo image. Looks
     designed, needs zero image hosting, and never shows up as
     a broken red X when someone blocks images.
     Swap [XX] for your initials (2 characters looks best).
     ============================================================ -->
<table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;font-family:Helvetica,Arial,sans-serif;">
  <tr>
    <td valign="top" style="padding:0 16px 0 0;">
      <table cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
        <tr>
          <td width="56" height="56" align="center" valign="middle"
              style="width:56px;height:56px;background-color:#C45C28;border-radius:6px;
                     font-family:Georgia,'Times New Roman',serif;font-size:24px;font-weight:bold;
                     color:#FAF6EF;text-align:center;line-height:56px;">
            [XX]
          </td>
        </tr>
      </table>
    </td>
    <td valign="top" style="border-left:3px solid #D9A030;padding:2px 0 2px 16px;">
      <span style="font-family:Georgia,'Times New Roman',serif;font-size:18px;font-weight:bold;color:#0E1520;">[FIRST NAME] [LAST NAME]</span><br>
      <span style="font-size:13px;color:#C45C28;font-weight:bold;">[JOB TITLE]</span>
      <span style="font-size:13px;color:#7A7268;">, [COMPANY NAME]</span><br>
      <span style="font-size:13px;line-height:20px;color:#0E1520;">
        <a href="tel:[PHONE-DIGITS-ONLY]" style="color:#0E1520;text-decoration:none;">[PHONE]</a>
        <span style="color:#C4C0B8;">&nbsp;|&nbsp;</span>
        <a href="https://[WEBSITE]" style="color:#C45C28;text-decoration:none;font-weight:bold;">[WEBSITE]</a>
      </span>
    </td>
  </tr>
</table>
